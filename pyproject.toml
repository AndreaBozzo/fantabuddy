[project]
name = "fantabuddy"
version = "0.1.0"
description = "Base dati e valutazioni riproducibili per aste Fantacalcio Classic"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.3.0",
  "httpx>=0.28.0",
  "ipykernel>=6.29.0",
  "jinja2>=3.1.0",
  "nbclient>=0.10.0",
  "nbformat>=5.10.0",
  "numpy>=2.1.0",
  "openpyxl>=3.1.5",
  "polars>=1.30.0",
  "pydantic>=2.11.0",
  "python-dotenv>=1.1.0",
  "pyyaml>=6.0.2",
  "pytz>=2025.2",
  "scikit-learn>=1.7.0",
  "typer>=0.16.0",
]

[project.scripts]
fantabuddy = "fantabuddy.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.16.0",
  "pytest>=8.4.0",
  "pytest-cov>=6.2.0",
  "respx>=0.22.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fantabuddy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/fantabuddy/report.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["fantabuddy"]

[[tool.mypy.overrides]]
module = ["openpyxl.*", "yaml", "sklearn.*"]
ignore_missing_imports = true
